name: BE v1 CI-CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# 같은 브랜치의 이전 배포가 끝나기 전에 새 배포가 앞서지 않도록 직렬화한다.
concurrency:
  group: v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 검증 및 이미지 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: 테스트 및 JAR 빌드
        run: bash ./gradlew --no-daemon test bootJar
      - name: 이미지 이름
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # AMD64 러너에서 ARM64 이미지도 빌드할 수 있도록 에뮬레이션을 준비한다.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: AMD64·ARM64 이미지 빌드 및 푸시
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: .
          # 하나의 태그와 인덱스 다이제스트로 t3와 t4g에 맞는 이미지를 선택한다.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 배포 이미지 고정
        id: reference
        if: github.event_name == 'push'
        env:
          IMAGE_NAME: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.docker.outputs.digest }}
        run: echo "image=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: 배포
    needs: build
    # dev는 항상 자동 배포하고, prod(main)는 명시적으로 활성화했을 때만 배포한다.
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'dev' ||
      (github.ref_name == 'main' && vars.CD_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # GitHub Environments 없이 브랜치별 Repository 설정을 선택한다.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH 배포
        env:
          DEPLOY_HOST: ${{ github.ref_name == 'main' && vars.PROD_DEPLOY_HOST || vars.DEV_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPOSE_PROJECT: ${{ vars.COMPOSE_PROJECT }}
          COMPOSE_FILE_NAME: ${{ vars.COMPOSE_FILE_NAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ github.ref_name == 'main' && secrets.PROD_SSH_KNOWN_HOSTS || secrets.DEV_SSH_KNOWN_HOSTS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 환경별 Secret 이름을 먼저 선택해 운영 값이 없어도 개발 값으로 대체되지 않게 한다.
          APP_ENV: ${{ secrets[github.ref_name == 'main' && 'PROD_APP_ENV' || 'DEV_APP_ENV'] }}
          IMAGE: ${{ needs.build.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ "$COMPOSE_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$COMPOSE_FILE_NAME" =~ ^[a-zA-Z0-9._-]+\.ya?ml$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          [[ "$GHCR_USER" =~ ^[a-zA-Z0-9_-]+(\[bot\])?$ ]]
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$GHCR_TOKEN"
          if [[ -z "$APP_ENV" ]]; then
            echo "::error::현재 브랜치에 해당하는 DEV_APP_ENV 또는 PROD_APP_ENV Secret을 등록하세요."
            exit 1
          fi
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          { printf '%s\n' "$GHCR_TOKEN"; printf '%s\n' "$APP_ENV"; } | ssh -i "$key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && bash scripts/deploy-v1.sh backend '$IMAGE' '$COMPOSE_PROJECT' '$COMPOSE_FILE_NAME' '$GHCR_USER'"

  deploy-v2:
    name: v2 배포 (CLOUD 이미지 갱신)
    needs: build
    # v2 dev는 CLOUD 저장소가 배포한다. 여기서는 CLOUD의 이미지 값만 바꿔 main에 올리고, CLOUD 파이프라인이 ECS에 반영한다.
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: v2-deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          repository: 100-hours-a-week/KTB4-5th-CLOUD
          ref: main
          token: ${{ secrets.CLOUD_REPO_TOKEN }}
      - name: CLOUD BeImage 갱신
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          SHA: ${{ github.sha }}
          PARAMS: infra/v2/params/dev.json
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # BE·FE가 동시에 푸시하면 한쪽이 거절되므로 최신 main을 받아 다시 시도한다.
          for attempt in 1 2 3; do
            grep -q '"ParameterKey": "BeImage"' "$PARAMS"
            sed -i -E "s#(\"ParameterKey\": \"BeImage\", \"ParameterValue\": \")[^\"]*#\1${IMAGE}#" "$PARAMS"
            if git diff --quiet; then
              echo "이미 같은 이미지입니다."
              exit 0
            fi
            git commit -q -am "deploy(v2-dev): BE ${SHA::7}"
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git reset -q --hard origin/main
          done
          exit 1
