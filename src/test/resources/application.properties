logging.file.name=build/logs/backend-test.log
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
oauth.frontend-base-url=http://localhost:3000
spring.security.oauth2.client.registration.kakao.client-id=test-kakao-client
spring.security.oauth2.client.registration.kakao.client-secret=test-kakao-secret
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost/api/v1/auth/oauth/code/kakao
# 열린 SSE 연결이 있으면 graceful shutdown이 종료 단계 제한 시간(30초)까지 기다려 테스트가 느려진다.
server.shutdown=immediate
# 캐시된 Spring 컨텍스트의 스케줄러가 테스트가 함께 쓰는 Redis·DB의 분석 전달·알림 대기 항목을 가져가지 않게 끈다. 테스트는 워커·알림을 직접 호출한다.
analysis.dispatch.enabled=false
analysis.notification.retry-enabled=false
analysis.feedback.enabled=false
