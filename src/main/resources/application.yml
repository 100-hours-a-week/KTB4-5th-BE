spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dameokja}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:dameokja_dev}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 15m
  refresh-token-expiration: 2d

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

push:
  auth-encryption:
    key: ${PUSH_AUTH_ENCRYPTION_KEY}
    key-version: ${PUSH_AUTH_ENCRYPTION_KEY_VERSION}
  vapid:
    public-key: ${PUSH_VAPID_PUBLIC_KEY}
    private-key: ${PUSH_VAPID_PRIVATE_KEY}
    key-version: ${PUSH_VAPID_KEY_VERSION}
    # 비워 두면 VAPID JWT에서 sub 클레임을 생략한다. 값을 넣을 때는 mailto: 또는 https: 형식이다.
    subject: ${PUSH_VAPID_SUBJECT:}
  # 매일 8시(서울) 만료·임박 알림 푸시 배치. 끄면 스케줄러 빈을 등록하지 않는다.
  expiration-batch:
    enabled: ${PUSH_EXPIRATION_BATCH_ENABLED:true}
  dispatch:
    concurrency: ${PUSH_DISPATCH_CONCURRENCY:20}
  test-api:
    # 로컬 수동 검증용 발송 API(PushTestController). 배포 환경은 기본값 false를 유지하고, 로컬에서만 .env로 켠다.
    enabled: ${PUSH_TEST_API_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never
