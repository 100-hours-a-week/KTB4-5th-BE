server:
  address: 127.0.0.1
  port: ${LAB_BE_PORT:38080}
spring:
  application:
    name: analysis-sandbox
  datasource:
    url: jdbc:mysql://127.0.0.1:33306/dispatch_lab?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: sandbox
    password: sandbox-only
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${LAB_POOL:10}
      transaction-isolation: ${LAB_ISOLATION:TRANSACTION_REPEATABLE_READ}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.type.java_time_use_direct_jdbc: true
  data:
    redis:
      host: 127.0.0.1
      port: 36379
      repositories.enabled: false
  task:
    scheduling:
      pool.size: 2
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: sandbox-client
            client-secret: sandbox-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:28080/api/v1/auth/oauth/code/kakao
            scope: account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
logging:
  file.name: logs/backend-${LAB_BE_PORT:38080}.log
  level.root: INFO
jwt:
  secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  access-token-expiration: 1d
  refresh-token-expiration: 2d
auth.cookie.secure: false
oauth.frontend-base-url: http://localhost:3000
cors.allowed-origins: http://localhost:3000
push:
  auth-encryption:
    key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    key-version: sandbox-v1
  vapid:
    public-key: BBsm6R4Q8Y7zDW6IP3LwAqDKguIYBLa83eH8r18Jd9ts8Dyt3xmcoSyL91wjkGIPymgWPJZPeol1iwrLafmJczY
    private-key: CaYwQ9blK0k4N0J-5tPLIQzYBpSJj24S6sWadUP7wCg
    key-version: sandbox-v1
  expiration-batch.enabled: false
ai:
  analysis:
    base-url: http://127.0.0.1:38081
    api-key: sandbox-ai-key
    connect-timeout: 1s
    read-timeout: 3s
analysis:
  job-ttl: 1d
  result-ttl: 1d
image:
  storage:
    bucket: sandbox-no-s3
    region: ap-northeast-2
    prefix: sandbox-images/
    presigned-url-ttl: 2m
    max-upload-bytes: 1048576
    allowed-content-types: image/png,image/jpeg
sentry.enabled: false

push.dispatch.enabled: false
sentry.logs.enabled: false
management.endpoints.web.exposure.include: health,prometheus
management.metrics.distribution.percentiles.hikaricp.connections.acquire: 0.5,0.99

push.analysis-ttl: 1h
push.dispatch.poll-interval: 1s
push.dispatch.lease-duration: 30s
push.dispatch.concurrency: 4
# 운영값(dev application.yml 기본값). 슬롯·조회 주기만 시나리오에서 바꾼다.
analysis.dispatch:
  enabled: true
  poll-interval: ${LAB_POLL:1s}
  slots: ${LAB_SLOTS:10}
  lease-duration: 30s
  callback-timeout: 2m
  expires-after: 30m
  max-attempts: 3
  retry-delay: 1s
  orphan-grace: 30s
  check-batch-size: 20
